name: 01-ci-api

on:
  pull_request:
    branches: [main]
    paths:
      - "src/FakeReports.Api/**"
      - "src/FakeReports.Api.Tests/**"
      - "src/FakeReports.sln"
      - ".editorconfig"
      - ".github/workflows/01-ci-api.yml"
      - "scripts/check-coverage.py"
      - "scripts/requirements-ci.txt"
  push:
    branches: [main]
    paths:
      - "src/FakeReports.Api/**"
      - "src/FakeReports.Api.Tests/**"
      - "src/FakeReports.sln"
      - "scripts/check-coverage.py"
      - "scripts/requirements-ci.txt"
  workflow_dispatch:

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  COVERAGE_THRESHOLD: "60"
  PYTHON_VERSION: "3.12"

jobs:
  restore-build:
    name: Restore + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore src/FakeReports.sln

      - name: Build (Release, treat warnings as errors)
        run: dotnet build src/FakeReports.sln -c Release --no-restore /warnaserror

      - name: Publish binaries
        run: |
          dotnet publish src/FakeReports.Api/FakeReports.Api.csproj \
            -c Release --no-build \
            -o ${{ github.workspace }}/artifacts/api \
            --self-contained false

      - name: Upload API binaries artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-binaries
          path: artifacts/api/**
          retention-days: 30
          if-no-files-found: error

  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: restore-build
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore (this job runs on a fresh runner, cannot rely on restore-build's artifacts)
        run: dotnet restore src/FakeReports.sln

      - name: Run tests + collect coverage (Cobertura)
        run: |
          set -euo pipefail
          dotnet test src/FakeReports.Api.Tests/FakeReports.Api.Tests.csproj \
            -c Release \
            --no-restore \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Locate coverage report
        id: locate
        run: |
          set -euo pipefail
          REPORT=$(find TestResults -name "coverage.cobertura.xml" -type f -print -quit)
          if [ -z "$REPORT" ]; then
            echo "::error::coverage.cobertura.xml not found"
            exit 1
          fi
          echo "report_path=$REPORT" >> "$GITHUB_OUTPUT"
          echo "Found: $REPORT"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-coverage-report
          path: ${{ steps.locate.outputs.report_path }}
          retention-days: 30

      - name: Setup Python (for coverage gate script)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install coverage gate dependencies (defusedxml)
        run: pip install -r scripts/requirements-ci.txt -r tests/requirements-tests.txt

      - name: Unit tests on check-coverage.py (XXE regression guard)
        run: python3 -m unittest tests.test_check_coverage -v

      - name: Coverage gate (>= ${{ env.COVERAGE_THRESHOLD }}%)
        env:
          REPORT_PATH: ${{ steps.locate.outputs.report_path }}
          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD }}
        run: python3 scripts/check-coverage.py

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@a6ddd83ac95ff4586f5d3aceeb314d9a1841db95 # v3.0.0
        with:
          name: .NET Test Results
          path: "TestResults/**/*.trx"
          reporter: dotnet-trx
          fail-on-error: false

  format:
    name: Format check (.editorconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: restore-build
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore src/FakeReports.sln

      - name: Verify formatting against .editorconfig (strict gate)
        run: |
          set -euo pipefail
          echo "::notice::Verifying code matches .editorconfig rules (strict gate)."
          dotnet format src/FakeReports.sln --verify-no-changes --verbosity normal

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history for gitleaks diff range)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
